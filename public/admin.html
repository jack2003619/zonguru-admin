<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zonguru Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-box {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .login-box h2 {
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px;
      margin: 7px 0 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    .primary {
      width: 100%;
      background: #2563eb;
      color: white;
    }

    .logout {
      background: #ef4444;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .hidden {
      display: none !important;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .tabs button {
      background: white;
      border: 1px solid #d1d5db;
    }

    .tabs button.active {
      background: #2563eb;
      color: white;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f3f4f6;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .green {
      color: #16a34a;
    }

    .red {
      color: #dc2626;
    }

    .message {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #eef2ff;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .small {
      padding: 7px 10px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      header {
        padding: 14px;
      }

      table {
        min-width: 650px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🛡️ Zonguru Admin</h1>
    <button id="logoutBtn" class="logout hidden" onclick="logout()">
      Logout
    </button>
  </header>

  <!-- LOGIN -->

  <div id="loginSection" class="login-box">

    <h2>Admin Login</h2>

    <div id="loginMessage"></div>

    <label>Username</label>
    <input
      id="username"
      type="text"
      placeholder="Admin username"
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Admin password"
    >

    <button class="primary" onclick="login()">
      Login
    </button>

  </div>

  <!-- ADMIN PANEL -->

  <div id="adminSection" class="container hidden">

    <div class="tabs">

      <button onclick="showTab('users')" id="usersTab">
        Users
      </button>

      <button onclick="showTab('transactions')" id="transactionsTab">
        Transactions
      </button>

      <button onclick="showTab('products')" id="productsTab">
        Products
      </button>

      <button onclick="showTab('messages')" id="messagesTab">
        Messages
      </button>

      <button onclick="showTab('audits')" id="auditsTab">
        Audit Logs
      </button>

    </div>

    <!-- USERS -->

    <section id="usersSection" class="card">

      <h2>Users</h2>

      <button onclick="loadUsers()">
        Refresh Users
      </button>

      <br><br>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Username</th>
              <th>Balance</th>
              <th>Currency</th>
              <th>Profit</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="usersTable"></tbody>

        </table>

      </div>

    </section>

    <!-- TRANSACTIONS -->

    <section id="transactionsSection" class="card hidden">

      <h2>Transactions</h2>

      <button onclick="loadTransactions()">
        Refresh Transactions
      </button>

      <br><br>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Type</th>
              <th>Amount</th>
              <th>Status</th>
              <th>User ID</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="transactionsTable"></tbody>

        </table>

      </div>

    </section>

    <!-- PRODUCTS -->

    <section id="productsSection" class="card hidden">

      <h2>Products</h2>

      <div class="card">

        <h3>Add Product</h3>

        <input
          id="productName"
          placeholder="Product name"
        >

        <input
          id="productCategory"
          placeholder="Category"
        >

        <input
          id="productPrice"
          type="number"
          placeholder="Price"
        >

        <input
          id="productProfit"
          type="number"
          placeholder="Profit rate"
        >

        <button onclick="addProduct()">
          Add Product
        </button>

      </div>

      <button onclick="loadProducts()">
        Refresh Products
      </button>

      <br><br>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Profit Rate</th>
              <th>Active</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="productsTable"></tbody>

        </table>

      </div>

    </section>

    <!-- MESSAGES -->

    <section id="messagesSection" class="card hidden">

      <h2>Send Message</h2>

      <input
        id="messageUserId"
        placeholder="User ID"
      >

      <textarea
        id="messageText"
        rows="5"
        placeholder="Message"
      ></textarea>

      <button onclick="sendMessage()">
        Send Message
      </button>

    </section>

    <!-- AUDITS -->

    <section id="auditsSection" class="card hidden">

      <h2>Audit Logs</h2>

      <button onclick="loadAudits()">
        Refresh Logs
      </button>

      <br><br>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Action</th>
              <th>Details</th>
              <th>Admin ID</th>
              <th>Date</th>
            </tr>
          </thead>

          <tbody id="auditsTable"></tbody>

        </table>

      </div>

    </section>

  </div>

<script>

const API = "https://zonguru-admin.onrender.com";

let token = localStorage.getItem(
  "zonguru_admin_token"
);

function showTab(tab) {

  const sections = [
    "users",
    "transactions",
    "products",
    "messages",
    "audits"
  ];

  sections.forEach(name => {

    const section =
      document.getElementById(
        name + "Section"
      );

    const button =
      document.getElementById(
        name + "Tab"
      );

    if (section) {
      section.classList.toggle(
        "hidden",
        name !== tab
      );
    }

    if (button) {
      button.classList.toggle(
        "active",
        name === tab
      );
    }

  });

}

async function api(
  path,
  options = {}
) {

  options.headers = {
    ...(options.headers || {}),
    "Content-Type": "application/json",
    "Authorization": "Bearer " + token
  };

  const response =
    await fetch(API + path, options);

  const data =
    await response.json();

  if (!response.ok) {
    throw new Error(
      data.message || "Request failed"
    );
  }

  return data;
}

async function login() {

  const username =
    document.getElementById(
      "username"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  const message =
    document.getElementById(
      "loginMessage"
    );

  message.innerHTML = "";

  if (!username || !password) {

    message.innerHTML =
      '<div class="message red">Enter username and password.</div>';

    return;
  }

  try {

    const response =
      await fetch(
        API + "/api/admin/login",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            username,
            password
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.message ||
        "Login failed"
      );
    }

    token = data.token;

    localStorage.setItem(
      "zonguru_admin_token",
      token
    );

    document
      .getElementById(
        "loginSection"
      )
      .classList.add("hidden");

    document
      .getElementById(
        "adminSection"
      )
      .classList.remove("hidden");

    document
      .getElementById(
        "logoutBtn"
      )
      .classList.remove("hidden");

    showTab("users");

    loadUsers();

  } catch (error) {

    message.innerHTML =
      `<div class="message red">${error.message}</div>`;

  }

}

function logout() {

  localStorage.removeItem(
    "zonguru_admin_token"
  );

  token = null;

  location.reload();

}

async function loadUsers() {

  try {

    const data =
      await api(
        "/api/admin/users"
      );

    const table =
      document.getElementById(
        "usersTable"
      );

    table.innerHTML = "";

    data.users.forEach(user => {

      const row =
        document.createElement("tr");

      row.innerHTML = `
        <td>${escapeHtml(user.username || "")}</td>

        <td>
          ${Number(user.balance || 0).toFixed(2)}
        </td>

        <td>
          ${escapeHtml(user.currency || "USDT")}
        </td>

        <td>
          ${Number(user.totalProfit || 0).toFixed(2)}
        </td>

        <td>
          <div class="actions">

            <button
              class="small"
              onclick="adjustBalance('${user._id}', 10)"
            >
              +10
            </button>

            <button
              class="small"
              onclick="adjustBalance('${user._id}', -10)"
            >
              -10
            </button>

            <button
              class="small"
              onclick="customBalance('${user._id}')"
            >
              Custom
            </button>

          </div>
        </td>
      `;

      table.appendChild(row);

    });

  } catch (error) {

    alert(error.message);

  }

}

async function adjustBalance(
  userId,
  amount
) {

  if (
    !confirm(
      `Adjust balance by ${amount}?`
    )
  ) {
    return;
  }

  try {

    await api(
      `/api/admin/users/${userId}/balance-adjust`,
      {
        method: "POST",
        body: JSON.stringify({
          delta: amount
        })
      }
    );

    alert("Balance updated.");

    loadUsers();

  } catch (error) {

    alert(error.message);

  }

}

async function customBalance(
  userId
) {

  const value =
    prompt(
      "Enter balance adjustment. Example: 50 or -20"
    );

  if (value === null) {
    return;
  }

  const amount =
    Number(value);

  if (
    !Number.isFinite(amount) ||
    amount === 0
  ) {
    alert("Invalid amount.");
    return;
  }

  adjustBalance(
    userId,
    amount
  );

}

async function loadTransactions() {

  try {

    const data =
      await api(
        "/api/admin/transactions"
      );

    const table =
      document.getElementById(
        "transactionsTable"
      );

    table.innerHTML = "";

    data.transactions.forEach(tx => {

      const row =
        document.createElement("tr");

      const status =
        String(tx.status || "");

      let actions = "";

      if (
        status === "pending"
      ) {

        actions = `
          <button
            class="small"
            onclick="approveTransaction('${tx._id}')"
          >
            Approve
          </button>

          <button
            class="small"
            onclick="rejectTransaction('${tx._id}')"
          >
            Reject
          </button>
        `;

      }

      row.innerHTML = `
        <td>${escapeHtml(tx.type || "")}</td>

        <td>
          ${Number(tx.amount || 0).toFixed(2)}
        </td>

        <td>
          ${escapeHtml(status)}
        </td>

        <td>
          ${escapeHtml(String(tx.userId || ""))}
        </td>

        <td>
          <div class="actions">
            ${actions}
          </div>
        </td>
      `;

      table.appendChild(row);

    });

  } catch (error) {

    alert(error.message);

  }

}

async function approveTransaction(
  id
) {

  if (
    !confirm(
      "Approve this transaction?"
    )
  ) {
    return;
  }

  try {

    await api(
      `/api/admin/transactions/${id}/approve`,
      {
        method: "POST"
      }
    );

    alert(
      "Transaction approved."
    );

    loadTransactions();

  } catch (error) {

    alert(error.message);

  }

}

async function rejectTransaction(
  id
) {

  const note =
    prompt(
      "Rejection note (optional):"
    );

  try {

    await api(
      `/api/admin/transactions/${id}/reject`,
      {
        method: "POST",
        body: JSON.stringify({
          note: note || ""
        })
      }
    );

    alert(
      "Transaction rejected."
    );

    loadTransactions();

  } catch (error) {

    alert(error.message);

  }

}

async function loadProducts() {

  try {

    const data =
      await api(
        "/api/admin/products"
      );

    const table =
      document.getElementById(
        "productsTable"
      );

    table.innerHTML = "";

    data.products.forEach(product => {

      const row =
        document.createElement("tr");

      row.innerHTML = `
        <td>${escapeHtml(product.name || "")}</td>

        <td>${escapeHtml(product.category || "")}</td>

        <td>${Number(product.price || 0).toFixed(2)}</td>

        <td>${Number(product.profitRate || 0)}</td>

        <td>${product.active ? "Yes" : "No"}</td>

        <td>
          <div class="actions">

            <button
              class="small"
              onclick="toggleProduct('${product._id}', ${product.active})"
            >
              ${product.active ? "Disable" : "Enable"}
            </button>

            <button
              class="small"
              onclick="deleteProduct('${product._id}')"
            >
              Delete
            </button>

          </div>
        </td>
      `;

      table.appendChild(row);

    });

  } catch (error) {

    alert(error.message);

  }

}

async function addProduct() {

  const name =
    document.getElementById(
      "productName"
    ).value.trim();

  const category =
    document.getElementById(
      "productCategory"
    ).value.trim();

  const price =
    Number(
      document.getElementById(
        "productPrice"
      ).value
    );

  const profitRate =
    Number(
      document.getElementById(
        "productProfit"
      ).value
    );

  try {

    await api(
      "/api/admin/products",
      {
        method: "POST",
        body: JSON.stringify({
          name,
          category,
          price,
          profitRate
        })
      }
    );

    alert(
      "Product created."
    );

    document.getElementById(
      "productName"
    ).value = "";

    document.getElementById(
      "productCategory"
    ).value = "";

    document.getElementById(
      "productPrice"
    ).value = "";

    document.getElementById(
      "productProfit"
    ).value = "";

    loadProducts();

  } catch (error) {

    alert(error.message);

  }

}

async function toggleProduct(
  id,
  current
) {

  try {

    await api(
      `/api/admin/products/${id}`,
      {
        method: "PATCH",
        body: JSON.stringify({
          active: !current
        })
      }
    );

    loadProducts();

  } catch (error) {

    alert(error.message);

  }

}

async function deleteProduct(
  id
) {

  if (
    !confirm(
      "Delete this product?"
    )
  ) {
    return;
  }

  try {

    await api(
      `/api/admin/products/${id}`,
      {
        method: "DELETE"
      }
    );

    loadProducts();

  } catch (error) {

    alert(error.message);

  }

}

async function sendMessage() {

  const userId =
    document.getElementById(
      "messageUserId"
    ).value.trim();

  const text =
    document.getElementById(
      "messageText"
    ).value.trim();

  if (!userId || !text) {

    alert(
      "User ID and message are required."
    );

    return;
  }

  try {

    await api(
      "/api/admin/messages",
      {
        method: "POST",
        body: JSON.stringify({
          userId,
          text
        })
      }
    );

    alert(
      "Message sent."
    );

    document.getElementById(
      "messageText"
    ).value = "";

  } catch (error) {

    alert(error.message);

  }

}

async function loadAudits() {

  try {

    const data =
      await api(
        "/api/admin/audits"
      );

    const table =
      document.getElementById(
        "auditsTable"
      );

    table.innerHTML = "";

    data.audits.forEach(audit => {

      const row =
        document.createElement("tr");

      row.innerHTML = `
        <td>${escapeHtml(audit.action || "")}</td>

        <td>${escapeHtml(audit.details || "")}</td>

        <td>${escapeHtml(String(audit.adminId || ""))}</td>

        <td>${new Date(audit.createdAt).toLocaleString()}</td>
      `;

      table.appendChild(row);

    });

  } catch (error) {

    alert(error.message);

  }

}

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

/* AUTO LOGIN */

if (token) {

  document
    .getElementById(
      "loginSection"
    )
    .classList.add("hidden");

  document
    .getElementById(
      "adminSection"
    )
    .classList.remove("hidden");

  document
    .getElementById(
      "logoutBtn"
    )
    .classList.remove("hidden");

  showTab("users");

  loadUsers();

}

</script>

</body>
  </html>
