<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zonguru Admin</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="brand">⚡ Zonguru Admin</div><button class="icon-btn" onclick="logout()">Logout</button></header>
<main class="container">
  <section class="hero compact"><div><div class="eyebrow">ADMIN PANEL</div><h1>Management</h1><p>Users and transaction requests</p></div></section>
  <section class="admin-tabs">
    <button class="tab active" onclick="loadUsers()">Users</button>
    <button class="tab" onclick="loadTransactions()">Transactions</button>
  </section>
  <div id="adminContent" class="admin-content"></div>
</main>
<script>
const API="https://zonguru-jack-api.onrender.com";
const token=localStorage.getItem("zonguru_token");
function headers(){return {"Authorization":"Bearer "+token,"Content-Type":"application/json"}}
function logout(){localStorage.clear();location.href="login.html"}
async function loadUsers(){
 const r=await fetch(API+"/api/admin/users",{headers:headers()}); const d=await r.json();
 if(!r.ok){alert(d.message||"Access denied");return}
 document.getElementById("adminContent").innerHTML=d.users.map(u=>`<div class="admin-row"><div><b>${u.username}</b><small>${u.role} · ${new Date(u.createdAt).toLocaleString()}</small></div><div><span>${Number(u.balance).toFixed(2)} USDT</span><button class="small-btn" onclick="setBalance('${u._id}',${u.balance})">Set balance</button></div></div>`).join("");
}
async function setBalance(id,current){
 const amount=prompt("New balance",current); if(amount===null)return;
 const r=await fetch(API+"/api/admin/users/"+id+"/balance",{method:"POST",headers:headers(),body:JSON.stringify({amount:Number(amount)})});
 const d=await r.json(); alert(d.message||"Done"); if(r.ok)loadUsers();
}
async function loadTransactions(){
 const r=await fetch(API+"/api/admin/transactions",{headers:headers()}); const d=await r.json();
 if(!r.ok){alert(d.message||"Access denied");return}
 document.getElementById("adminContent").innerHTML=d.transactions.map(t=>`<div class="admin-row"><div><b>${t.type}</b><small>${t._id}<br>${new Date(t.createdAt).toLocaleString()}</small></div><div><b>${Number(t.amount).toFixed(2)}</b><small>${t.status}</small>${t.status==="pending"?`<div><button class="small-btn" onclick="review('${t._id}','approve')">Approve</button><button class="small-btn danger-text" onclick="review('${t._id}','reject')">Reject</button></div>`:""}</div></div>`).join("");
}
async function review(id,action){
 const r=await fetch(API+"/api/admin/transactions/"+id+"/"+action,{method:"POST",headers:headers()}); const d=await r.json(); alert(d.message||"Done"); loadTransactions();
}
if(!token) location.href="login.html"; else loadUsers();
</script>
</body>
</html>
